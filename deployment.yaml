apiVersion: apps/v1
kind: Deployment
metadata:
  name: tp3-jenkins-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tp3-jenkins
  template:
    metadata:
      labels:
        app: tp3-jenkins
    spec:
      containers:
        - name: tp3-jenkins
          image: medaminegdouraucar/tp3-jenkins
          ports:
            - containerPort: 80
